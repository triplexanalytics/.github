<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Triplex data flow</title>
  <desc id="desc">Your data file, recipe file, salt and passphrase go into Triplex, which runs on your computer or in your browser tab. Out come the shared file, the encrypted mapping file and the reports, all on your computer. Nothing goes to Triplex Analytics or anywhere else.</desc>
  <rect width="960" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#034078"/>
    </marker>
  </defs>

  <!-- The organisation's perimeter -->
  <rect x="16" y="16" width="928" height="330" rx="12" fill="#f7f8fa"/>
  <text x="40" y="48" font-size="13" font-weight="600" fill="#5f5f5f" letter-spacing="1">YOUR ORGANISATION: YOUR COMPUTER OR YOUR BROWSER TAB</text>

  <!-- Inputs -->
  <text x="40" y="88" font-size="15" font-weight="600" fill="#0a0a0a">In</text>
  <g font-size="14" fill="#222222">
    <rect x="40" y="100" width="240" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="56" y="122" font-weight="600">Your data file</text>
    <text x="56" y="141" fill="#5f5f5f" font-size="12.5">CSV, TSV, JSON Lines or Parquet</text>
    <rect x="40" y="164" width="240" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="56" y="186" font-weight="600">Recipe or contract file</text>
    <text x="56" y="205" fill="#5f5f5f" font-size="12.5">.triplex.yaml, holds no secrets</text>
    <rect x="40" y="228" width="240" height="72" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="56" y="250" font-weight="600">Salt and passphrase</text>
    <text x="56" y="269" fill="#5f5f5f" font-size="12.5">typed in, or read from an</text>
    <text x="56" y="286" fill="#5f5f5f" font-size="12.5">environment variable; never stored</text>
  </g>

  <!-- Triplex -->
  <rect x="352" y="100" width="256" height="200" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="364" y="114" width="4" height="172" rx="2" fill="#034078"/>
  <text x="384" y="136" font-size="17" font-weight="700" fill="#0a0a0a">Triplex</text>
  <g font-size="12.5" fill="#222222">
    <text x="384" y="162">command line, Python, Jupyter</text>
    <text x="384" y="180">or the web UI</text>
    <text x="384" y="212" fill="#5f5f5f">masks, measures risk, generates</text>
    <text x="384" y="230" fill="#5f5f5f">synthetic data, checks contracts</text>
    <text x="384" y="266" font-weight="600" fill="#034078">No network access</text>
    <text x="384" y="284" fill="#5f5f5f">reads and writes only your files</text>
  </g>

  <!-- Outputs -->
  <text x="680" y="88" font-size="15" font-weight="600" fill="#0a0a0a">Out</text>
  <g font-size="14" fill="#222222">
    <rect x="680" y="100" width="252" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="696" y="122" font-weight="600">The file you share</text>
    <text x="696" y="141" fill="#5f5f5f" font-size="12.5">pseudonymised, or synthetic</text>
    <rect x="680" y="164" width="252" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="696" y="186" font-weight="600">Mapping file</text>
    <text x="696" y="205" fill="#5f5f5f" font-size="12.5">encrypted when you set a passphrase</text>
    <rect x="680" y="228" width="252" height="72" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="696" y="250" font-weight="600">Reports</text>
    <text x="696" y="269" fill="#5f5f5f" font-size="12.5">audit JSON, HTML report that opens</text>
    <text x="696" y="286" fill="#5f5f5f" font-size="12.5">offline, reproduce.py</text>
  </g>

  <!-- Arrows -->
  <g stroke="#034078" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M284 126 C 320 126, 320 170, 348 180"/>
    <path d="M284 190 L 348 196"/>
    <path d="M284 264 C 320 264, 320 220, 348 212"/>
    <path d="M612 180 C 640 170, 640 126, 676 126"/>
    <path d="M612 196 L 676 190"/>
    <path d="M612 212 C 640 220, 640 264, 676 264"/>
  </g>

  <!-- Outside -->
  <rect x="16" y="372" width="928" height="82" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-dasharray="5 5"/>
  <text x="40" y="402" font-size="13" font-weight="600" fill="#5f5f5f" letter-spacing="1">OUTSIDE YOUR ORGANISATION</text>
  <text x="40" y="430" font-size="14" fill="#222222"><tspan font-weight="600">Triplex Analytics, and any other party: </tspan>receives nothing. No upload, no telemetry, no account, no licence check.</text>
  <line x1="480" y1="300" x2="480" y2="368" stroke="#a8aab2" stroke-width="2" stroke-dasharray="4 5"/>
  <circle cx="480" cy="334" r="11" fill="#ffffff" stroke="#a8aab2" stroke-width="2"/>
  <path d="M474 328 L486 340 M486 328 L474 340" stroke="#a8aab2" stroke-width="2"/>
</svg>
